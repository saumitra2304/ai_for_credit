name: Desktop installers

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: credit_ai_frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Python sidecar
        working-directory: reasoning_layer
        run: |
          python -m pip install -r requirment.txt pyinstaller
          python -m PyInstaller reasoning_layer.spec
          New-Item -ItemType Directory -Force -Path ..\credit_ai_frontend\src-tauri\binaries | Out-Null
          Copy-Item dist\reasoning-layer.exe ..\credit_ai_frontend\src-tauri\binaries\reasoning-layer.exe
      - name: Frontend deps
        working-directory: credit_ai_frontend
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          probe_api_key: ${{ secrets.PROBE_API_KEY }}
          INSTA_API_KEY: ${{ secrets.INSTA_API_KEY }}
          OPENAI_API_KEY: ollama
          OPENAI_BASE_URL: http://127.0.0.1:11434/v1
          OPENAI_MODEL_NAME: qwen3:8b
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
        with:
          projectPath: credit_ai_frontend
          args: --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: kuber-windows-installer
          path: credit_ai_frontend/src-tauri/target/release/bundle/nsis/*.exe
